name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            laravel: '10.*'
            testbench: '8.*'
          - php: '8.2'
            laravel: '10.*'
            testbench: '8.*'
          - php: '8.3'
            laravel: '10.*'
            testbench: '8.*'
          - php: '8.2'
            laravel: '11.*'
            testbench: '9.*'
          - php: '8.3'
            laravel: '11.*'
            testbench: '9.*'
          - php: '8.2'
            laravel: '12.*'
            testbench: '10.*'
          - php: '8.3'
            laravel: '12.*'
            testbench: '10.*'

    env:
      # Composer 2.10+ blocks advisory-affected versions from the solver pool.
      # Laravel matrix testing still needs those lines until patches land.
      COMPOSER_NO_BLOCKING: '1'

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, bcmath
          coverage: xdebug

      - name: Install dependencies
        run: |
          composer require \
            "illuminate/support:${{ matrix.laravel }}" \
            "illuminate/http:${{ matrix.laravel }}" \
            "illuminate/routing:${{ matrix.laravel }}" \
            "illuminate/events:${{ matrix.laravel }}" \
            "illuminate/log:${{ matrix.laravel }}" \
            "illuminate/cache:${{ matrix.laravel }}" \
            "illuminate/queue:${{ matrix.laravel }}" \
            "illuminate/database:${{ matrix.laravel }}" \
            "illuminate/contracts:${{ matrix.laravel }}" \
            --no-update --no-interaction
          composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies

      - name: Lint
        if: matrix.php == '8.3' && matrix.laravel == '12.*'
        run: vendor/bin/pint --test

      - name: PHPStan
        if: matrix.php == '8.3' && matrix.laravel == '12.*'
        run: vendor/bin/phpstan analyse --memory-limit=1G

      - name: Tests
        run: vendor/bin/pest

      - name: Coverage gate
        if: matrix.php == '8.3' && matrix.laravel == '12.*'
        run: vendor/bin/pest --coverage --min=90
        env:
          XDEBUG_MODE: coverage
