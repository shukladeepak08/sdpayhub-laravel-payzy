name: Bug report
description: Report a problem with Payzy
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Payzy. Please fill in as much as you can.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear description of the bug.
      placeholder: When I call Payzy::gateway('razorpay')->create()...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps or code snippet.
      render: php
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: PHP, Laravel, and Payzy versions
      placeholder: PHP 8.3 / Laravel 11 / sdpayhub/laravel-payzy 1.0.1
    validations:
      required: true

  - type: dropdown
    id: gateway
    attributes:
      label: Gateway
      multiple: true
      options:
        - Razorpay
        - Stripe
        - PayPal
        - Paytm
        - PhonePe
        - Not gateway-specific
    validations:
      required: true
